<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your booking</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/icon.svg"><style>.steps{display:flex;gap:4px;margin:10px 0}.steps div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.steps i{display:block;height:8px;border-radius:99px;background:var(--acl);margin-bottom:6px}.steps .on i{background:var(--ac)}.steps .on{color:var(--ink);font-weight:700}.eta{background:var(--acl);border-radius:14px;padding:14px;margin:12px 0}.eta small{display:block;color:var(--mut);margin:2px 0 10px}.bar{height:10px;border-radius:99px;background:#fff;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}</style></head><body>
<div class="hero"><small>Your booking</small><h1 id="n">Manage booking</h1></div>
<div class="wrap"><div class="card" id="c">Loading…</div></div>
<script>
let X={};
const t=new URLSearchParams(location.search).get('t')||'',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post=b=>fetch('/api/manage',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t,...b})}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong');return j});
const map=a=>' <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a)+'">Map</a>';
const when=ts=>new Date(String(ts).replace(' ','T')+'Z').toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const trk=b=>{if(b.status==='cancelled')return '<p class="err"><b>This booking was cancelled.</b></p>'+hist(b);
 const S=['Requested','Confirmed','In progress','Ready','Completed'],i={pending:0,confirmed:b.stage?2:1,ready:3,done:4}[b.status]??0;
 return '<p><b>Step '+(i+1)+' of 5: '+S[i]+'</b>'+(b.stage?' · '+esc(b.stage):'')+'</p><div class="steps" role="list">'+S.map((s,k)=>'<div role="listitem" class="'+(k<=i?'on':'')+'"><i></i>'+s+'</div>').join('')+'</div>'+hist(b)};
const hist=b=>{const l=(b.events&&b.events.length?b.events:[{ts:b.created_at,label:'Booking requested'}]);return '<h3>Updates</h3>'+l.map(x=>'<div style="margin:8px 0"><b>'+esc(x.label)+'</b><br><small>'+esc(when(x.ts))+'</small></div>').join('')};
const eta=b=>{if(!b.due_date||b.status==='cancelled')return '';
 const d0=new Date(b.date+'T00:00:00'),d1=new Date(b.due_date+'T00:00:00'),now=new Date(new Date().toDateString()),tot=Math.max(1,Math.round((d1-d0)/864e5)),left=Math.round((d1-now)/864e5),pct=b.status==='done'?100:Math.min(100,Math.max(4,Math.round(100*(tot-left)/tot)));
 const txt=b.status==='done'?'Completed':left>1?left+' days left':left===1?'1 day left':left===0?'Due today':'Running '+(-left)+' day'+(left<-1?'s':'')+' late';
 return '<div class="eta"><b>Expected delivery: '+esc(d1.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+'</b><small>About '+tot+' days in total · '+txt+'</small><div class="bar" role="img" aria-label="'+pct+' percent of the time frame has passed"><i style="width:'+pct+'%"></i></div></div>'};
const money=n=>(X.currency||'MWK')+' '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const shrink=(f,mx,t='image/jpeg',q=.7)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const r=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*r;c.height=i.height*r;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL(t,q))};i.onerror=()=>no(new Error('Please choose a photo (JPG or PNG).'));i.src=URL.createObjectURL(f)});
const payHtml=b=>{if(b.status==='cancelled')return '';const bal=Math.max(0,(b.price||0)-(b.paid||0));
 const h=(b.payments||[]).map(p=>'<div style="margin:6px 0"><b>'+esc(money(p.amount))+'</b> · '+esc(p.kind)+'<br><small>'+({pending:'Received, waiting to be checked',verified:'Confirmed',rejected:'Not accepted, please contact us'}[p.status]||esc(p.status))+' · '+esc(when(p.ts))+'</small>'+(p.status==='verified'?'<br><a href="/receipt.html?t='+encodeURIComponent(t)+'&p='+p.id+'">View or download receipt</a>':'')+'</div>').join('');
 return '<div style="border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0"><h3 style="margin:0 0 6px">Payment</h3>'+(b.price>0?'<p>Price: <b>'+esc(money(b.price))+'</b><br>Paid: <b>'+esc(money(b.paid||0))+'</b><br>Balance: <b>'+esc(money(bal))+'</b></p>':'')
 +(X.payinfo?'<p style="margin:0 0 4px"><b>How to pay</b></p><p style="white-space:pre-line;margin:0 0 8px">'+esc(X.payinfo)+'</p><button type="button" class="bt o" id="cp" style="min-height:44px">Copy payment details</button>':'<p class="m">Payment details will be shared by our team.</p>')
 +(h?'<h3>Your payments</h3>'+h:'')
 +'<h3>Send proof of payment</h3><form id="pf"><label>Amount you paid ('+esc(X.currency||'MWK')+')<input name="amount" type="number" min="1" step="any" inputmode="decimal" required></label><label>What was it for?<select name="kind"><option value="deposit">Deposit</option><option value="full">Full payment</option><option value="balance">Balance</option></select></label><label>Reference or note (optional)<input name="note"></label><label>Photo of the receipt or screenshot<input type="file" name="proof" accept="image/*" required></label><button class="p">Send proof</button><div id="pmsg" role="status" class="err"></div></form></div>'};
const extra=b=>(b.items?'<p>Items: <b>'+esc(b.items)+'</b></p>':'')+eta(b)+trk(b)+payHtml(b)+(b.address?'<p>Delivery address: '+esc(b.address)+map(b.address)+'</p>':'')+(X.showroom?'<p>Find us: '+esc(X.showroom)+map(X.showroom)+'</p>':'');
function show(b){c.innerHTML='<h3 style="margin-top:0">'+esc(b.service)+'</h3><p>'+esc(b.date)+' at '+esc(b.time)+'<br><small>Status: '+esc(b.status)+'</small></p>'+extra(b)+(b.status==='cancelled'?'<p class="m">This booking was cancelled. Please contact us to book again.</p>':
 '<form id="f"><label>New date<input type="date" name="date" required min="'+new Date().toLocaleDateString('en-CA')+'"></label><label>New time<input type="time" name="time" required></label><button class="p">Request new time</button><div id="msg" role="status" class="err"></div></form><button class="bt o" id="x" style="width:100%;margin-top:12px;color:#B42318">Cancel this booking</button>');
 const pf=document.getElementById('pf');if(pf)pf.onsubmit=async ev=>{ev.preventDefault();const m=document.getElementById('pmsg');m.className='m';m.textContent='Sending…';
  try{const d=new FormData(pf),photo=await shrink(d.get('proof'),1000);await post({action:'proof',amount:d.get('amount'),kind:d.get('kind'),note:d.get('note'),photo});await load();alert('Thank you. We received your proof of payment and will confirm it shortly.')}catch(x){m.className='err';m.textContent=x.message||'Could not send. Please try again.'}};
 const cb=document.getElementById('cp');if(cb)cb.onclick=async()=>{try{await navigator.clipboard.writeText(X.payinfo);cb.textContent='Copied'}catch{cb.textContent='Select and copy the text above'}};
 const f=document.getElementById('f');if(!f)return;
 f.onsubmit=async ev=>{ev.preventDefault();msg.textContent='Sending…';try{const v=Object.fromEntries(new FormData(f));await post({action:'move',...v});await load();alert('Your new time was requested. We will confirm it shortly.')}catch(x){msg.textContent=x.message}};
 x.onclick=async()=>{if(!confirm('Cancel this booking?'))return;try{await post({action:'cancel'});await load()}catch(x){alert(x.message)}}}
const load=()=>fetch('/api/manage?t='+encodeURIComponent(t)).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error);n.textContent=j.business_name;document.title=j.business_name;if(j.brand)document.documentElement.style.setProperty('--ac',j.brand);X=j;show(j)}).catch(x=>{c.textContent=x.message||'This link is not valid.'});
load();setInterval(()=>{if(!document.hidden&&!/INPUT|SELECT/.test(document.activeElement.tagName))load()},15000);
</script></body></html>
