<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your booking</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/icon.svg"><style>.steps{display:flex;gap:4px;margin:10px 0}.steps div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.steps i{display:block;height:8px;border-radius:99px;background:var(--acl);margin-bottom:6px}.steps .on i{background:var(--ac)}.steps .on{color:var(--ink);font-weight:700}</style></head><body>
<div class="hero"><small>Your booking</small><h1 id="n">Manage booking</h1></div>
<div class="wrap"><div class="card" id="c">Loading…</div></div>
<script>
let X={};
const t=new URLSearchParams(location.search).get('t')||'',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post=b=>fetch('/api/manage',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t,...b})}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong');return j});
const map=a=>' <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a)+'">Map</a>';
const when=ts=>new Date(String(ts).replace(' ','T')+'Z').toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const trk=b=>{if(b.status==='cancelled')return '<p class="err"><b>This booking was cancelled.</b></p>'+hist(b);
 const S=['Requested','Confirmed','In progress','Ready','Completed'],i={pending:0,confirmed:b.stage?2:1,ready:3,done:4}[b.status]??0;
 return '<p><b>Step '+(i+1)+' of 5: '+S[i]+'</b>'+(b.stage?' · '+esc(b.stage):'')+'</p><div class="steps" role="list">'+S.map((s,k)=>'<div role="listitem" class="'+(k<=i?'on':'')+'"><i></i>'+s+'</div>').join('')+'</div>'+hist(b)};
const hist=b=>{const l=(b.events&&b.events.length?b.events:[{ts:b.created_at,label:'Booking requested'}]);return '<h3>Updates</h3>'+l.map(x=>'<div style="margin:8px 0"><b>'+esc(x.label)+'</b><br><small>'+esc(when(x.ts))+'</small></div>').join('')};
const extra=b=>(b.items?'<p>Items: <b>'+esc(b.items)+'</b></p>':'')+trk(b)+(b.price>0?'<p>Price: '+esc(b.price)+', paid: '+esc(b.paid||0)+', balance: <b>'+esc(Math.max(0,b.price-(b.paid||0)))+'</b></p>':'')+(b.address?'<p>Delivery address: '+esc(b.address)+map(b.address)+'</p>':'')+(X.showroom?'<p>Find us: '+esc(X.showroom)+map(X.showroom)+'</p>':'')+(X.payinfo?'<p style="white-space:pre-line"><b>How to pay</b>\n'+esc(X.payinfo)+'</p>':'');
function show(b){c.innerHTML='<h3 style="margin-top:0">'+esc(b.service)+'</h3><p>'+esc(b.date)+' at '+esc(b.time)+'<br><small>Status: '+esc(b.status)+'</small></p>'+extra(b)+(b.status==='cancelled'?'<p class="m">This booking was cancelled. Please contact us to book again.</p>':
 '<form id="f"><label>New date<input type="date" name="date" required min="'+new Date().toLocaleDateString('en-CA')+'"></label><label>New time<input type="time" name="time" required></label><button class="p">Request new time</button><div id="msg" role="status" class="err"></div></form><button class="bt o" id="x" style="width:100%;margin-top:12px;color:#B42318">Cancel this booking</button>');
 const f=document.getElementById('f');if(!f)return;
 f.onsubmit=async ev=>{ev.preventDefault();msg.textContent='Sending…';try{const v=Object.fromEntries(new FormData(f));await post({action:'move',...v});await load();alert('Your new time was requested. We will confirm it shortly.')}catch(x){msg.textContent=x.message}};
 x.onclick=async()=>{if(!confirm('Cancel this booking?'))return;try{await post({action:'cancel'});await load()}catch(x){alert(x.message)}}}
const load=()=>fetch('/api/manage?t='+encodeURIComponent(t)).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error);n.textContent=j.business_name;document.title=j.business_name;if(j.brand)document.documentElement.style.setProperty('--ac',j.brand);X=j;show(j)}).catch(x=>{c.textContent=x.message||'This link is not valid.'});
load();setInterval(()=>{if(!document.hidden&&!/INPUT|SELECT/.test(document.activeElement.tagName))load()},60000);
</script></body></html>
