<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bookings</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css"><meta name="theme-color" content="#0F766E"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
body{display:flex;flex-direction:column;min-height:100dvh}main{flex:1}
nav{position:sticky;bottom:0;display:flex;gap:2px;padding:6px 8px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--bd)}
nav button{flex:1;min-height:48px;border:0;border-radius:12px;background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:500}
nav button.on{background:var(--acl);color:#0B5F58;font-weight:700}
.stats{display:flex;gap:10px;margin-bottom:12px}.stats div{flex:1;background:#fff;border-radius:16px;padding:12px 14px;font-size:12px;color:var(--mut);box-shadow:0 8px 24px #0f1b2d12}.stats b{display:block;font-size:28px;color:var(--ink)}
.bk{display:flex;align-items:center;gap:14px}.tm{width:62px;font-weight:700}.tm small{display:block;font-weight:400}.g{flex:1;min-width:0}.g b,.g small,.g a{display:block}
select.s{min-height:44px;border-radius:999px;padding:0 10px;font-size:13px;font-weight:700}
select.confirmed,select.done{background:var(--acl);color:#0B5F58}select.pending{background:#FFF1DC;color:#8A4B00}select.cancelled{color:var(--mut)}
.chips{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.chips button{min-height:44px;padding:0 16px;border:1px solid #C5CCD8;border-radius:999px;background:#fff;font:inherit}.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.url{font-size:13px;color:var(--mut);word-break:break-all;margin:6px 0 12px}.r2{display:flex;gap:10px}.r2>*{flex:1}
@media(min-width:900px){body{flex-direction:row}nav{order:-1;flex-direction:column;width:220px;height:100dvh;top:0;border-top:0;border-right:1px solid var(--bd);padding:24px 12px;gap:6px}nav button{text-align:left;padding:0 16px;font-size:15px}.hero,.wrap{max-width:none}.wrap{max-width:760px;margin-left:0;margin-right:auto;padding-left:32px}.hero{padding-left:48px}}
</style></head>
<body>
<main id="app" aria-live="polite">Loading…</main>
<nav aria-label="Main"><button data-v="today" class="on">Overview</button><button data-v="all">Bookings</button><button data-v="new">New</button><button data-v="share">Share</button><button data-v="settings">Settings</button></nav>
<script>
let pin=localStorage.pin||'',S={business_name:"Nthawi's Furniture",catalog:'[]'},B=[],view='today',flt='all',L=[];
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.toLocaleDateString('en-CA'),today=()=>iso(new Date());
const fmt=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const cat=()=>{try{return JSON.parse(S.catalog)}catch{return[]}};
async function api(p,o={}){const r=await fetch('/api/'+p,{...o,headers:{'content-type':'application/json','x-pin':pin}});
  if(r.status===401){pin=prompt('Enter the app PIN')||'';if(!pin)throw new Error('PIN required');localStorage.pin=pin;return api(p,o)}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Server error '+r.status);return d}
async function load(){S=await api('settings');B=await api('bookings?from='+iso(new Date(Date.now()-30*864e5)));render()}
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
const row=b=>`<div class="card"><div class="bk"><div class="tm">${e(b.time)}<small>${fmt(b.date)}</small></div><div class="g"><b>${e(b.client)}</b><small>${e(b.service)}</small>${b.phone?`<a href="tel:${e(b.phone)}">${e(b.phone)}</a>`:''}${b.notes?`<small>${e(b.notes)}</small>`:''}</div>
<select class="s ${b.status}" aria-label="Status for ${e(b.client)}" onchange="setStatus(${b.id},this.value)">${['pending','confirmed','done','cancelled'].map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select></div></div>`;
function render(){
  document.title=S.business_name;const td=today(),wk=iso(new Date(Date.now()+7*864e5)),live=B.filter(b=>b.status!=='cancelled');
  const hero=(t,s)=>`<div class="hero"><small>${s}</small><h1>${e(t)}</h1></div><div class="wrap">`;
  let h='';
  if(view==='today'){const t=live.filter(b=>b.date===td),p=B.filter(b=>b.status==='pending');
    h=hero(S.business_name,fmt(td))+`<div class="stats"><div><b>${t.length}</b>Today</div><div><b>${p.length}</b>Pending</div><div><b>${live.filter(b=>b.date>=td&&b.date<=wk).length}</b>Next 7 days</div></div>
<h2>Today</h2>${t.map(row).join('')||'<div class="card m">No bookings today.</div>'}<h2>Waiting for confirmation</h2>${p.map(row).join('')||'<div class="card m">No pending requests.</div>'}`}
  if(view==='all'){h=hero('Bookings','All appointments')+`<div class="chips">${['all','pending','confirmed','done','cancelled'].map(f=>`<button class="${f===flt?'on':''}" onclick="flt='${f}';render()">${f}</button>`).join('')}</div>`;
    let last='';const l=B.filter(b=>flt==='all'?b.status!=='cancelled':b.status===flt);
    for(const b of l){if(b.date!==last){h+=`<h2>${fmt(b.date)}</h2>`;last=b.date}h+=row(b)}if(!l.length)h+='<div class="card m">Nothing here yet.</div>'}
  if(view==='new')h=hero('New booking','Add an appointment')+`<div class="card"><form onsubmit="add(event)"><label>Client<input name="client" required></label><label>Phone<input name="phone" type="tel"></label>
<label>Service<input name="service" list="sv" required></label><datalist id="sv">${cat().flatMap(c=>c.services).map(s=>`<option value="${e(s)}">`).join('')}</datalist>
<div class="two"><label>Date<input name="date" type="date" value="${td}" required></label><label>Time<input name="time" type="time" required></label></div><label>Notes<input name="notes"></label><button class="p">Save booking</button></form></div>`;
  if(view==='share'){const base=location.origin+'/book.html';L=[{n:'All services',u:base},...cat().map(c=>({n:c.name,u:base+'?c='+slug(c.name)}))];
    h=hero('Share booking links','Send these to your clients')+L.map((l,i)=>`<div class="card"><b>${e(l.n)}</b><div class="url">${e(l.u)}</div><div class="r2"><button class="bt" onclick="cp(${i})">Copy link</button><a class="bt o" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Book with '+S.business_name+' ('+l.n+'): '+l.u)}">WhatsApp</a></div></div>`).join('')}
  if(view==='settings')h=hero('Settings','Business')+`<div class="card"><form onsubmit="save(event)"><label>Business name<input name="business_name" value="${e(S.business_name)}" required></label>
<label>Services, one group per line<textarea name="catalog">${e(cat().map(c=>c.name+': '+c.services.join(', ')).join('\n'))}</textarea></label><small>Format: Group name: service one, service two</small><button class="p">Save settings</button></form>
<button class="bt o" style="margin-top:14px" onclick="pin='';localStorage.pin='';location.reload()">Forget PIN on this device</button></div>`;
  $('#app').innerHTML=h+'</div>'}
async function cp(i){const u=L[i].u;try{await navigator.clipboard.writeText(u);alert('Link copied')}catch{prompt('Copy this link',u)}}
async function setStatus(id,status){try{await api('bookings/'+id,{method:'PATCH',body:JSON.stringify({status})});await load()}catch(x){alert(x.message)}}
async function add(ev){ev.preventDefault();try{await api('bookings',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(ev.target)))});await load();go('today')}catch(x){alert(x.message)}}
async function save(ev){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));
  const catalog=JSON.stringify(f.catalog.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const[n,...r]=l.split(':');return{name:n.trim(),services:r.join(':').split(',').map(s=>s.trim()).filter(Boolean)}}).filter(c=>c.name&&c.services.length));
  try{await api('settings',{method:'PUT',body:JSON.stringify({business_name:f.business_name,catalog})});await load();alert('Saved')}catch(x){alert(x.message)}}
load().catch(x=>{$('#app').innerHTML='<div class="wrap"><div class="card err">'+e(x.message)+'</div></div>'});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
