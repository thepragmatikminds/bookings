name = "bookings"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "nthawis-bookings"
database_id = "124c291a-a9f6-4885-8b31-e52bd19635a2"

# Weekly clean-up (and backup, if the R2 bucket below is connected). Mondays 03:00 UTC.
[triggers]
crons = ["0 3 * * 1"]

# Optional backups: create an R2 bucket named nthawis-backups, then remove the # signs below.
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "nthawis-backups"

# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
# ...


